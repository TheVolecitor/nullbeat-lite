    // ── Download Queue State & Management ──────────────────────────────────────
    const dlQueueItems = new Map();
    let isDlQueueCollapsed = false;

    function toggleDlQueue() {
      const q = document.getElementById('dlQueue');
      isDlQueueCollapsed = !isDlQueueCollapsed;
      q.classList.toggle('collapsed', isDlQueueCollapsed);
    }

    function updateDlQueueUI() {
      const q = document.getElementById('dlQueue');
      const countEl = document.getElementById('dlQueueCount');
      const count = dlQueueItems.size;
      if (count === 0) {
        q.style.display = 'none';
        return;
      }
      q.style.display = 'block';
      countEl.textContent = count;
    }

    function addDlQueueItem(id, title, abortController, btn, origBtnHtml, artUrl) {
      const list = document.getElementById('dlQueueList');
      const itemEl = document.createElement('div');
      itemEl.className = 'dl-queue-item';
      itemEl.id = `dlItem_${id}`;
      const safeArt = artUrl || '/favicon.png';
      itemEl.innerHTML = `
    <img class="dl-item-art" id="dlArt_${id}" src="${esc(safeArt)}" alt="" onerror="this.src='/favicon.png'">
    <div class="dl-item-main">
      <div class="dl-item-top">
        <div class="dl-item-title" title="${esc(title)}">${esc(title)}</div>
        <div class="dl-item-status" id="dlStatus_${id}">REQUESTING…</div>
        <button class="dl-item-cancel" id="dlCancel_${id}" onclick="cancelDlQueueItem('${id}')" title="Cancel download">&times;</button>
      </div>
      <div class="dl-progress-bar">
        <div class="dl-progress-fill requesting" id="dlFill_${id}"></div>
      </div>
      <div class="dl-item-sub">
        <span id="dlSpeed_${id}">Preparing stream…</span>
        <span id="dlPct_${id}">0%</span>
      </div>
    </div>
  `;
      list.prepend(itemEl);
      dlQueueItems.set(id, { itemEl, title, abortController, btn, origBtnHtml, artUrl: safeArt });
      updateDlQueueUI();
    }

    function cancelDlQueueItem(id) {
      const item = dlQueueItems.get(id);
      if (!item) return;

      if (item.abortController) {
        try { item.abortController.abort(); } catch (_) { }
      }

      if (item.btn) {
        item.btn.innerHTML = item.origBtnHtml || dlSvg(13);
        item.btn.disabled = false;
        item.btn.classList.remove('done');
      }

      const statusEl = document.getElementById(`dlStatus_${id}`);
      const fillEl = document.getElementById(`dlFill_${id}`);
      const speedEl = document.getElementById(`dlSpeed_${id}`);
      const cancelBtn = document.getElementById(`dlCancel_${id}`);
      if (cancelBtn) cancelBtn.remove();
      if (statusEl) {
        statusEl.textContent = 'CANCELLED';
        statusEl.className = 'dl-item-status err';
      }
      if (fillEl) {
        fillEl.classList.remove('requesting');
        fillEl.style.width = '0%';
      }
      if (speedEl) speedEl.textContent = 'Cancelled';

      setTimeout(() => {
        const itemEl = document.getElementById(`dlItem_${id}`);
        if (itemEl) {
          itemEl.classList.add('clearing');
          setTimeout(() => {
            itemEl.remove();
            dlQueueItems.delete(id);
            updateDlQueueUI();
          }, 250);
        }
      }, 1200);
    }

    function setDlQueueProgress(id, pct, speedText, receivedText, totalText) {
      const statusEl = document.getElementById(`dlStatus_${id}`);
      const fillEl = document.getElementById(`dlFill_${id}`);
      const speedEl = document.getElementById(`dlSpeed_${id}`);
      const pctEl = document.getElementById(`dlPct_${id}`);
      if (!statusEl || !fillEl) return;

      fillEl.classList.remove('requesting');
      fillEl.style.width = `${pct}%`;
      statusEl.textContent = 'DOWNLOADING';
      if (speedEl) {
        speedEl.textContent = (receivedText && totalText)
          ? `${receivedText} / ${totalText} · ${speedText}`
          : (speedText || 'Downloading…');
      }
      if (pctEl) pctEl.textContent = `${pct}%`;
    }

    function setDlQueueCompleted(id) {
      const statusEl = document.getElementById(`dlStatus_${id}`);
      const fillEl = document.getElementById(`dlFill_${id}`);
      const speedEl = document.getElementById(`dlSpeed_${id}`);
      const pctEl = document.getElementById(`dlPct_${id}`);
      const itemEl = document.getElementById(`dlItem_${id}`);
      const cancelBtn = document.getElementById(`dlCancel_${id}`);
      if (cancelBtn) cancelBtn.remove();

      if (statusEl) {
        statusEl.textContent = 'COMPLETED ✓';
        statusEl.className = 'dl-item-status ok';
      }
      if (fillEl) {
        fillEl.classList.remove('requesting');
        fillEl.classList.add('completed');
        fillEl.style.width = '100%';
      }
      if (speedEl) speedEl.textContent = 'Saved to downloads';
      if (pctEl) pctEl.textContent = '100%';

      // After 5 seconds of completed, remove from queue
      setTimeout(() => {
        if (itemEl) {
          itemEl.classList.add('clearing');
          setTimeout(() => {
            itemEl.remove();
            dlQueueItems.delete(id);
            updateDlQueueUI();
          }, 300);
        }
      }, 5000);
    }

    function setDlQueueFailed(id, errMessage) {
      const statusEl = document.getElementById(`dlStatus_${id}`);
      const fillEl = document.getElementById(`dlFill_${id}`);
      const speedEl = document.getElementById(`dlSpeed_${id}`);
      const itemEl = document.getElementById(`dlItem_${id}`);
      const cancelBtn = document.getElementById(`dlCancel_${id}`);
      if (cancelBtn) cancelBtn.remove();

      if (statusEl) {
        statusEl.textContent = 'FAILED';
        statusEl.className = 'dl-item-status err';
      }
      if (fillEl) {
        fillEl.classList.remove('requesting');
        fillEl.style.width = '0%';
      }
      if (speedEl) speedEl.textContent = errMessage || 'Download error';

      setTimeout(() => {
        if (itemEl) {
          itemEl.classList.add('clearing');
          setTimeout(() => {
            itemEl.remove();
            dlQueueItems.delete(id);
            updateDlQueueUI();
          }, 300);
        }
      }, 5000);
    }

    function fmtBytes(bytes) {
      if (!bytes || bytes <= 0) return '0 MB';
      return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
    }

    function fmtSpeed(bytesPerSec) {
      if (!bytesPerSec || bytesPerSec <= 0) return '0 KB/s';
      if (bytesPerSec >= 1024 * 1024) {
        return `${(bytesPerSec / (1024 * 1024)).toFixed(1)} MB/s`;
      }
      return `${(bytesPerSec / 1024).toFixed(0)} KB/s`;
    }

    // ── Time-Synced Lyrics Fetcher (LRCLIB API) ───────────────────────────────
    async function fetchSyncedLyrics(meta) {
      if (!meta || !meta.title) return null;

      const rawTitle = meta.title || '';
      const rawArtist = meta.artist || '';
      const rawAlbum = meta.album || '';
      const durationSec = meta.duration ? Math.round(Number(meta.duration)) : null;

      const cleanTitle = rawTitle
        .replace(/\s*-\s*From\s*.*$/i, '')
        .replace(/\s*\([^)]*(?:feat|ft|remix|version|deluxe|bonus|indie)[^)]*\)/gi, '')
        .trim();
      const primaryArtist = rawArtist.split(/[,&/]/)[0].trim();

      function evaluateItem(item) {
        if (!item || item.instrumental) return null;
        const synced = (item.syncedLyrics && typeof item.syncedLyrics === 'string') ? item.syncedLyrics.trim() : '';
        const plain = (item.plainLyrics && typeof item.plainLyrics === 'string') ? item.plainLyrics.trim() : '';
        if (synced && synced.length > 10 && /\[\d{2}:\d{2}/.test(synced)) {
          return { synced: true, text: synced };
        }
        if (plain && plain.length > 10 && !plain.toLowerCase().includes('[instrumental]')) {
          return { synced: false, text: plain };
        }
        return null;
      }

      // Pure client-side browser fetch with X-User-Agent: NullBeat/1.0.0
      const headers = {
        'X-User-Agent': 'NullBeat/1.0.0'
      };

      async function queryLrc(endpoint, params) {
        try {
          const directUrl = `https://lrclib.net/api/${endpoint}?${params.toString()}`;
          const res = await fetch(directUrl, {
            headers,
            signal: AbortSignal.timeout(6000)
          });
          if (res.ok) return await res.json();
        } catch (_) { }

        return null;
      }

      // 1. Direct GET request with exact metadata
      try {
        const params = new URLSearchParams();
        params.append('track_name', rawTitle);
        if (rawArtist) params.append('artist_name', rawArtist);
        if (rawAlbum) params.append('album_name', rawAlbum);
        if (durationSec) params.append('duration', String(durationSec));

        const data = await queryLrc('get', params);
        if (data && !Array.isArray(data)) {
          const picked = evaluateItem(data);
          if (picked && picked.synced) return picked;
        }
      } catch (_) { }

      // 2. Direct GET with cleaned title & primary artist
      if (cleanTitle !== rawTitle || primaryArtist !== rawArtist) {
        try {
          const params = new URLSearchParams();
          params.append('track_name', cleanTitle);
          if (primaryArtist) params.append('artist_name', primaryArtist);
          if (durationSec) params.append('duration', String(durationSec));

          const data = await queryLrc('get', params);
          if (data && !Array.isArray(data)) {
            const picked = evaluateItem(data);
            if (picked && picked.synced) return picked;
          }
        } catch (_) { }
      }

      // 3. Fallback to Search API (picking vocalist-sided, time-synced lyrics)
      try {
        const searchQueries = [
          { track_name: cleanTitle, artist_name: primaryArtist },
          { track_name: rawTitle, artist_name: primaryArtist },
          { track_name: cleanTitle }
        ];

        for (const q of searchQueries) {
          const params = new URLSearchParams();
          if (q.track_name) params.append('track_name', q.track_name);
          if (q.artist_name) params.append('artist_name', q.artist_name);

          const list = await queryLrc('search', params);
          if (!Array.isArray(list) || list.length === 0) continue;

          // Filter: only vocalists (not instrumental)
          const vocalItems = list.filter(item => !item.instrumental);

          // Separate into items with syncedLyrics
          const syncedItems = vocalItems.filter(item => {
            const s = item.syncedLyrics;
            return s && typeof s === 'string' && s.trim().length > 10 && /\[\d{2}:\d{2}/.test(s);
          });

          if (syncedItems.length > 0) {
            if (durationSec) {
              syncedItems.sort((a, b) => {
                const diffA = Math.abs((a.duration || 0) - durationSec);
                const diffB = Math.abs((b.duration || 0) - durationSec);
                return diffA - diffB;
              });
            }
            return { synced: true, text: syncedItems[0].syncedLyrics.trim() };
          }

          // Fallback to best plain lyrics
          const plainItems = vocalItems.filter(item => {
            const p = item.plainLyrics;
            return p && typeof p === 'string' && p.trim().length > 10 && !p.toLowerCase().includes('[instrumental]');
          });

          if (plainItems.length > 0) {
            if (durationSec) {
              plainItems.sort((a, b) => Math.abs((a.duration || 0) - durationSec) - Math.abs((b.duration || 0) - durationSec));
            }
            return { synced: false, text: plainItems[0].plainLyrics.trim() };
          }
        }
      } catch (_) { }

      return null;
    }

    // ── Metadata Injector (FLAC Vorbis Comment & Picture + M4A ilst Atoms) ──
    async function fetchCoverArt(rawUrl) {
      if (!rawUrl) return null;
      const hiResUrl = String(rawUrl).replace(/640x640/g, '1280x1280').replace(/320x320/g, '1280x1280');
      try {
        const res = await fetch(hiResUrl);
        if (res.ok) return new Uint8Array(await res.arrayBuffer());
      } catch (_) { }
      try {
        const res = await fetch(rawUrl);
        if (res.ok) return new Uint8Array(await res.arrayBuffer());
      } catch (_) { }
      return null;
    }

    function makeBox(type, payload) {
      const size = 8 + (payload ? payload.length : 0);
      const buf = new Uint8Array(size);
      const view = new DataView(buf.buffer);
      view.setUint32(0, size, false);
      if (typeof type === 'string') {
        for (let i = 0; i < 4; i++) {
          buf[4 + i] = (type || '    ').charCodeAt(i) & 0xFF;
        }
      } else if (type && type.length >= 4) {
        for (let i = 0; i < 4; i++) {
          buf[4 + i] = type[i];
        }
      }
      if (payload) buf.set(payload, 8);
      return buf;
    }

    function concatBytes(arrays) {
      const total = arrays.reduce((acc, a) => acc + (a ? a.length : 0), 0);
      const out = new Uint8Array(total);
      let pos = 0;
      for (const a of arrays) {
        if (!a) continue;
        out.set(a, pos);
        pos += a.length;
      }
      return out;
    }

    function makeItunesTextAtom(fourCC, text) {
      if (!text) return null;
      const textBytes = new TextEncoder().encode(text);
      const dataPayload = new Uint8Array(8 + textBytes.length);
      const view = new DataView(dataPayload.buffer);
      view.setUint32(0, 1, false); // type_code = 1 (UTF-8)
      view.setUint32(4, 0, false); // locale = 0
      dataPayload.set(textBytes, 8);
      const dataBox = makeBox('data', dataPayload);
      return makeBox(fourCC, dataBox);
    }

    function makeItunesCoverAtom(imageBytes) {
      if (!imageBytes || !imageBytes.length) return null;
      const isPng = imageBytes[0] === 0x89 && imageBytes[1] === 0x50;
      const typeCode = isPng ? 14 : 13;
      const dataPayload = new Uint8Array(8 + imageBytes.length);
      const view = new DataView(dataPayload.buffer);
      view.setUint32(0, typeCode, false);
      view.setUint32(4, 0, false);
      dataPayload.set(imageBytes, 8);
      const dataBox = makeBox('data', dataPayload);
      return makeBox('covr', dataBox);
    }

    function buildUdtaBox(meta, imageBytes, lyrics) {
      const atoms = [
        makeItunesTextAtom([0xA9, 0x6E, 0x61, 0x6D], meta.title),                                                           // ©nam (Title)
        makeItunesTextAtom([0xA9, 0x41, 0x52, 0x54], meta.artist),                                                          // ©ART (Artist)
        makeItunesTextAtom([0xA9, 0x61, 0x6C, 0x62], meta.album),                                                           // ©alb (Album)
        makeItunesTextAtom('aART', meta.albumArtist || meta.artist),                                                         // aART (Album Artist)
        makeItunesTextAtom([0xA9, 0x64, 0x61, 0x79], meta.year ? String(meta.year) : (meta.releaseDate ? String(meta.releaseDate).slice(0, 4) : null)), // ©day (Year)
        lyrics && lyrics.text ? makeItunesTextAtom([0xA9, 0x6C, 0x79, 0x72], lyrics.text) : null,                            // ©lyr (Lyrics)
        makeItunesCoverAtom(imageBytes)
      ].filter(Boolean);

      const ilstPayload = concatBytes(atoms);
      const ilstBox = makeBox('ilst', ilstPayload);

      const hdlrPayload = new Uint8Array(25);
      const mdir = 'mdir';
      for (let i = 0; i < 4; i++) hdlrPayload[8 + i] = mdir.charCodeAt(i) & 0xFF;
      const appl = 'appl';
      for (let i = 0; i < 4; i++) hdlrPayload[12 + i] = appl.charCodeAt(i) & 0xFF;
      const hdlrBox = makeBox('hdlr', hdlrPayload);

      const metaSubBoxes = concatBytes([new Uint8Array(4), hdlrBox, ilstBox]);
      const metaBox = makeBox('meta', metaSubBoxes);

      return makeBox('udta', metaBox);
    }

    function injectM4aMetadata(m4aBytes, meta, imageBytes, lyrics) {
      let offset = 0;
      let moovStart = -1;
      let moovSize = 0;
      const view = new DataView(m4aBytes.buffer, m4aBytes.byteOffset, m4aBytes.byteLength);

      while (offset + 8 <= m4aBytes.length) {
        const size = view.getUint32(offset, false);
        const type = String.fromCharCode(m4aBytes[offset + 4], m4aBytes[offset + 5], m4aBytes[offset + 6], m4aBytes[offset + 7]);
        if (size < 8) break;

        if (type === 'moov') {
          moovStart = offset;
          moovSize = size;
          break;
        }
        offset += size;
      }

      if (moovStart === -1) return m4aBytes;

      const moovPayload = m4aBytes.subarray(moovStart + 8, moovStart + moovSize);
      let moovSubOffset = 0;
      const moovSubView = new DataView(moovPayload.buffer, moovPayload.byteOffset, moovPayload.byteLength);
      const keptMoovChildren = [];

      while (moovSubOffset + 8 <= moovPayload.length) {
        const subSize = moovSubView.getUint32(moovSubOffset, false);
        const subType = String.fromCharCode(
          moovPayload[moovSubOffset + 4], moovPayload[moovSubOffset + 5],
          moovPayload[moovSubOffset + 6], moovPayload[moovSubOffset + 7]
        );
        if (subSize < 8 || moovSubOffset + subSize > moovPayload.length) {
          keptMoovChildren.push(moovPayload.subarray(moovSubOffset));
          break;
        }
        if (subType !== 'udta') {
          keptMoovChildren.push(moovPayload.subarray(moovSubOffset, moovSubOffset + subSize));
        }
        moovSubOffset += subSize;
      }

      const newUdta = buildUdtaBox(meta, imageBytes, lyrics);
      keptMoovChildren.push(newUdta);

      const newMoovPayload = concatBytes(keptMoovChildren);
      const newMoovBox = makeBox('moov', newMoovPayload);

      const beforeMoov = m4aBytes.subarray(0, moovStart);
      const afterMoov = m4aBytes.subarray(moovStart + moovSize);

      return concatBytes([beforeMoov, newMoovBox, afterMoov]);
    }

    function buildVorbisCommentBlock(comments, vendor = 'NullBeat') {
      const enc = new TextEncoder();
      const vendorBytes = enc.encode(vendor);
      let size = 4 + vendorBytes.length + 4;
      const encodedComments = comments.map(c => enc.encode(c));
      for (const c of encodedComments) {
        size += 4 + c.length;
      }

      const buf = new Uint8Array(size);
      const view = new DataView(buf.buffer);
      let pos = 0;

      view.setUint32(pos, vendorBytes.length, true);
      pos += 4;
      buf.set(vendorBytes, pos);
      pos += vendorBytes.length;

      view.setUint32(pos, encodedComments.length, true);
      pos += 4;

      for (const c of encodedComments) {
        view.setUint32(pos, c.length, true);
        pos += 4;
        buf.set(c, pos);
        pos += c.length;
      }

      return buf;
    }

    function buildPictureBlock(imageBytes) {
      let mime = 'image/jpeg';
      if (imageBytes[0] === 0x89 && imageBytes[1] === 0x50 && imageBytes[2] === 0x4E && imageBytes[3] === 0x47) {
        mime = 'image/png';
      }
      const enc = new TextEncoder();
      const mimeBytes = enc.encode(mime);

      const totalLen = 4 + 4 + mimeBytes.length + 4 + 4 + 4 + 4 + 4 + 4 + imageBytes.length;
      const buf = new Uint8Array(totalLen);
      const view = new DataView(buf.buffer);
      let pos = 0;

      view.setUint32(pos, 3, false); pos += 4; // Cover (front)
      view.setUint32(pos, mimeBytes.length, false); pos += 4;
      buf.set(mimeBytes, pos); pos += mimeBytes.length;
      view.setUint32(pos, 0, false); pos += 4; // description length = 0
      view.setUint32(pos, 0, false); pos += 4; // width
      view.setUint32(pos, 0, false); pos += 4; // height
      view.setUint32(pos, 24, false); pos += 4; // color depth
      view.setUint32(pos, 0, false); pos += 4; // indexed colors
      view.setUint32(pos, imageBytes.length, false); pos += 4;
      buf.set(imageBytes, pos);

      return buf;
    }

    function injectFlacMetadata(flacBytes, meta, imageBytes, lyrics) {
      if (flacBytes[0] !== 0x66 || flacBytes[1] !== 0x4C || flacBytes[2] !== 0x61 || flacBytes[3] !== 0x43) {
        return flacBytes;
      }

      let offset = 4;
      let isLast = false;
      const preservedBlocks = [];

      while (offset < flacBytes.length && !isLast) {
        const headerByte = flacBytes[offset];
        isLast = (headerByte & 0x80) !== 0;
        const blockType = headerByte & 0x7F;
        const blockLen = (flacBytes[offset + 1] << 16) | (flacBytes[offset + 2] << 8) | flacBytes[offset + 3];

        if (blockType !== 4 && blockType !== 6) {
          preservedBlocks.push({
            type: blockType,
            data: flacBytes.subarray(offset + 4, offset + 4 + blockLen)
          });
        }

        offset += 4 + blockLen;
      }

      const audioDataOffset = offset;
      const comments = [];
      if (meta.title) comments.push(`TITLE=${meta.title}`);
      if (meta.artist) comments.push(`ARTIST=${meta.artist}`);
      if (meta.album) comments.push(`ALBUM=${meta.album}`);
      if (meta.albumArtist || meta.artist) comments.push(`ALBUMARTIST=${meta.albumArtist || meta.artist}`);
      if (meta.date || meta.year || meta.releaseDate) comments.push(`DATE=${meta.date || meta.year || meta.releaseDate}`);
      if (meta.trackNumber) comments.push(`TRACKNUMBER=${meta.trackNumber}`);
      if (meta.isrc) comments.push(`ISRC=${meta.isrc}`);
      if (lyrics && lyrics.text) {
        comments.push(`LYRICS=${lyrics.text}`);
        if (lyrics.synced) {
          comments.push(`SYNCEDLYRICS=${lyrics.text}`);
        } else {
          comments.push(`UNSYNCEDLYRICS=${lyrics.text}`);
        }
      }
      comments.push('COMMENT=NullBeat');

      const vorbisData = buildVorbisCommentBlock(comments);
      const picData = imageBytes && imageBytes.length ? buildPictureBlock(imageBytes) : null;

      const newBlocks = [...preservedBlocks];
      newBlocks.push({ type: 4, data: vorbisData });
      if (picData) {
        newBlocks.push({ type: 6, data: picData });
      }

      let totalHeaderSize = 4;
      for (const b of newBlocks) {
        totalHeaderSize += 4 + b.data.length;
      }

      const audioData = flacBytes.subarray(audioDataOffset);
      const output = new Uint8Array(totalHeaderSize + audioData.length);
      output.set([0x66, 0x4C, 0x61, 0x43], 0);
      let outPos = 4;

      for (let i = 0; i < newBlocks.length; i++) {
        const b = newBlocks[i];
        const isLastBlock = (i === newBlocks.length - 1);
        output[outPos] = (isLastBlock ? 0x80 : 0) | (b.type & 0x7F);
        output[outPos + 1] = (b.data.length >> 16) & 0xFF;
        output[outPos + 2] = (b.data.length >> 8) & 0xFF;
        output[outPos + 3] = b.data.length & 0xFF;
        outPos += 4;
        output.set(b.data, outPos);
        outPos += b.data.length;
      }

      output.set(audioData, outPos);
      return output;
    }

    // ── Filename Extraction & In-Window Download ───────────────────────────────
    function extractTorboxFilename(res, fileUrl, fallbackTitle) {
      try {
        const cd = res && res.headers ? res.headers.get('content-disposition') : null;
        if (cd) {
          const match = cd.match(/filename\*?=['"]?(?:UTF-8'')?([^'";\n]+)['"]?/i);
          if (match && match[1]) {
            return decodeURIComponent(match[1].trim());
          }
        }
      } catch (_) { }

      const urlsToCheck = [res && res.url, fileUrl].filter(Boolean);
      for (const uStr of urlsToCheck) {
        try {
          const u = new URL(uStr, window.location.href);
          const fn = u.searchParams.get('filename');
          if (fn) return decodeURIComponent(fn.trim());
          const segs = u.pathname.split('/').filter(Boolean);
          const last = segs[segs.length - 1];
          if (last && /\.(flac|mp3|m4a|wav|aac)$/i.test(last)) {
            return decodeURIComponent(last.trim());
          }
        } catch (_) { }
      }

      if (fallbackTitle) {
        return fallbackTitle.endsWith('.flac') || fallbackTitle.endsWith('.mp3')
          ? fallbackTitle
          : `${fallbackTitle}.flac`;
      }
      return 'track.flac';
    }

    async function downloadInWindow(fileUrl, fallbackTitle, onProgress, signal, trackMeta, coverPromise, lyricsPromise) {
      if (signal?.aborted) throw new DOMException('Aborted', 'AbortError');
      const res = await fetch(fileUrl, { signal });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);

      const finalFilename = extractTorboxFilename(res, fileUrl, fallbackTitle);
      const contentLength = res.headers.get('content-length');
      const total = contentLength ? parseInt(contentLength, 10) : 0;

      let blob;
      if (res.body && total > 0) {
        const reader = res.body.getReader();
        let received = 0;
        const chunks = [];
        const startTime = performance.now();
        let lastTime = startTime;
        let lastBytes = 0;
        let currentSpeed = 0;

        while (true) {
          if (signal?.aborted) {
            try { reader.cancel(); } catch (_) { }
            throw new DOMException('Aborted', 'AbortError');
          }
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(value);
          received += value.length;

          const now = performance.now();
          const timeDiff = (now - lastTime) / 1000;
          if (timeDiff >= 0.25) {
            currentSpeed = (received - lastBytes) / timeDiff;
            lastTime = now;
            lastBytes = received;
          }

          if (onProgress) {
            const pct = Math.min(100, Math.round((received / total) * 100));
            const speedStr = fmtSpeed(currentSpeed || (received / ((now - startTime) / 1000)));
            onProgress(pct, speedStr, fmtBytes(received), fmtBytes(total), finalFilename);
          }
        }
        blob = new Blob(chunks);
      } else {
        blob = await res.blob();
      }

      if (signal?.aborted) throw new DOMException('Aborted', 'AbortError');

      // Inject metadata, cover art & time-synced lyrics directly into the blob
      if (trackMeta) {
        try {
          const coverBytes = coverPromise ? await coverPromise : null;
          const lyricsData = lyricsPromise ? await lyricsPromise : null;
          const fnLower = (finalFilename || '').toLowerCase();
          if (fnLower.endsWith('.flac')) {
            const rawBytes = new Uint8Array(await blob.arrayBuffer());
            const tagged = injectFlacMetadata(rawBytes, trackMeta, coverBytes, lyricsData);
            blob = new Blob([tagged], { type: 'audio/flac' });
          } else if (fnLower.endsWith('.m4a') || fnLower.endsWith('.mp4')) {
            const rawBytes = new Uint8Array(await blob.arrayBuffer());
            const tagged = injectM4aMetadata(rawBytes, trackMeta, coverBytes, lyricsData);
            blob = new Blob([tagged], { type: 'audio/mp4' });
          }
        } catch (tagErr) {
          console.warn('[Metadata Injector Error]:', tagErr.message);
        }
      }

      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = finalFilename;
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(blobUrl), 30000);
      return finalFilename;
    }

    async function downloadSingleTrack(trackOrId, maybeTitle, btn) {
      const trackMeta = (trackOrId && typeof trackOrId === 'object')
        ? trackOrId
        : { id: trackOrId, title: maybeTitle };
      const id = trackMeta.id;
      const title = trackMeta.title || 'track';

      const orig = btn ? btn.innerHTML : null;
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<span class="spin"></span>';
      }

      const queueTaskId = `${id}_${Date.now()}`;
      const abortController = new AbortController();
      const initialArt = trackMeta.artworkURL || trackMeta.artwork_url || (nowPlaying && String(nowPlaying.id) === String(id) ? nowPlaying.artworkURL : null) || '/favicon.png';
      addDlQueueItem(queueTaskId, title, abortController, btn, orig, initialArt);

      // Pre-fetch 1280x1280 cover artwork and time-synced lyrics concurrently
      let coverPromise = null;
      if (trackMeta.artworkURL) {
        coverPromise = fetchCoverArt(trackMeta.artworkURL);
      }
      let lyricsPromise = fetchSyncedLyrics(trackMeta);

      try {
        const url = `/${tok()}/stream/${encodeURIComponent(id)}?torbox_download=true&download=true&web=true`;
        const r = await fetch(url, { signal: abortController.signal });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const d = await r.json();
        if (!d.url) throw new Error('No URL returned from server');

        const fullMeta = {
          ...trackMeta,
          ...d,
          title: trackMeta.title || d.title,
          artist: trackMeta.artist || d.artist,
          album: trackMeta.album || d.album,
          artworkURL: trackMeta.artworkURL || d.artworkURL || d.artwork_url,
          year: trackMeta.year || trackMeta.releaseDate || d.year || d.releaseDate,
          duration: trackMeta.duration || d.duration
        };

        if (fullMeta.artworkURL) {
          const artImg = document.getElementById(`dlArt_${queueTaskId}`);
          if (artImg && (!artImg.src || artImg.src.includes('favicon.png'))) {
            artImg.src = fullMeta.artworkURL;
          }
        }

        if (!coverPromise && fullMeta.artworkURL) {
          coverPromise = fetchCoverArt(fullMeta.artworkURL);
        }
        if (!trackMeta.duration && fullMeta.duration) {
          const prevLrcPromise = lyricsPromise;
          lyricsPromise = prevLrcPromise.then(res => {
            if (res && res.synced) return res;
            return fetchSyncedLyrics(fullMeta);
          });
        }

        await downloadInWindow(d.url, d.filename || `${title}.flac`, (pct, speed, rec, tot, fn) => {
          if (btn) btn.innerHTML = `<span class="spin"></span> ${pct}%`;
          setDlQueueProgress(queueTaskId, pct, speed, rec, tot);
          if (fn) {
            const itemTitleEl = document.querySelector(`#dlItem_${queueTaskId} .dl-item-title`);
            if (itemTitleEl && itemTitleEl.textContent !== fn) {
              itemTitleEl.textContent = fn;
              itemTitleEl.title = fn;
            }
          }
        }, abortController.signal, fullMeta, coverPromise, lyricsPromise);

        setDlQueueCompleted(queueTaskId);
        if (btn) {
          btn.innerHTML = `<span style="color:var(--green)">✓ OK</span>`;
          btn.classList.add('done');
          setTimeout(() => {
            btn.innerHTML = orig;
            btn.classList.remove('done');
            btn.disabled = false;
          }, 3000);
        }
      } catch (e) {
        if (e.name === 'AbortError' || abortController.signal.aborted) {
          return;
        }
        setDlQueueFailed(queueTaskId, e.message);
        if (btn) {
          btn.innerHTML = orig;
          btn.disabled = false;
        }
        throw e;
      }
    }

    // ── Download Button Handler ────────────────────────────────────────────────

    async function dlAll(tracks) {
      if (!apiKey) { openKeyModal(true); return; }
      if (!tracks || !tracks.length) return;

      const queue = [...tracks];
      const CONCURRENCY = 3;

      async function worker() {
        while (queue.length > 0) {
          const t = queue.shift();
          if (!t) break;
          const btn = document.getElementById(`dlBtn_${t.id}`);
          try {
            await downloadSingleTrack(t, t.title, btn);
          } catch (_) { }
        }
      }

      const workers = [];
      for (let i = 0; i < Math.min(CONCURRENCY, tracks.length); i++) {
        workers.push(worker());
      }
      await Promise.all(workers);
    }

    // ── Player & Smooth Seek State ─────────────────────────────────────────────
    let isSeeking = false;
    let seekAnimFrame = null;

    function onSeekInput(v) {
      isSeeking = true;
      const pct = Math.min(100, Math.max(0, (v / 1000) * 100));
      const pSeek = document.getElementById('pSeek');
      pSeek.style.setProperty('--seek-pct', `${pct}%`);
      if (!isNaN(audio.duration) && audio.duration > 0) {
        const curTime = (v / 1000) * audio.duration;
        document.getElementById('pTime').textContent = `${fmtDur(curTime)} / ${fmtDur(audio.duration)}`;
      }
    }

    function onSeekChange(v) {
      if (!isNaN(audio.duration) && audio.duration > 0) {
        audio.currentTime = (v / 1000) * audio.duration;
      }
      isSeeking = false;
    }

    function startSmoothProgress() {
      if (seekAnimFrame) cancelAnimationFrame(seekAnimFrame);
      function step() {
        if (!audio.paused && !audio.seeking && !isSeeking && !isNaN(audio.duration) && audio.duration > 0) {
          const cur = audio.currentTime;
          const dur = audio.duration;
          const pct = Math.min(100, Math.max(0, (cur / dur) * 100));
          const pSeek = document.getElementById('pSeek');
          pSeek.value = (pct * 10).toFixed(1);
          pSeek.style.setProperty('--seek-pct', `${pct}%`);
          document.getElementById('pTime').textContent = `${fmtDur(cur)} / ${fmtDur(dur)}`;
        }
        if (!audio.paused && !audio.ended) {
          seekAnimFrame = requestAnimationFrame(step);
        }
      }
      seekAnimFrame = requestAnimationFrame(step);
    }

    function stopSmoothProgress() {
      if (seekAnimFrame) {
        cancelAnimationFrame(seekAnimFrame);
        seekAnimFrame = null;
      }
    }

    function endPlayer() {
      stopSmoothProgress();
      audio.pause();
      audio.removeAttribute('src');
      audio.load();

      nowPlaying = null;
      document.body.classList.remove('has-player');
      const bar = document.getElementById('playerBar');
      if (bar) bar.classList.remove('visible');

      document.getElementById('pTitle').textContent = '—';
      document.getElementById('pArtist').textContent = '—';
      document.getElementById('pQuality').textContent = '';
      document.getElementById('pCover').src = '/favicon.png';
      const pSeek = document.getElementById('pSeek');
      pSeek.value = 0;
      pSeek.style.setProperty('--seek-pct', '0%');
      document.getElementById('pTime').textContent = '0:00 / 0:00';

      setPlayIcon(false);
      updateRowStates();
      stopVisualizer();
    }

    async function playTrack(t) {
      nowPlaying = t;
      document.body.classList.add('has-player');
      document.getElementById('playerBar').classList.add('visible');
      document.getElementById('pCover').src = t.artworkURL || '/favicon.png';
      document.getElementById('pTitle').textContent = t.title;
      document.getElementById('pArtist').textContent = t.artist;
      document.getElementById('pQuality').textContent = '';

      setPlayIcon(true, true); // loading
      updateRowStates();

      initAudioContext();

      try {
        const r = await fetch(`/${tok()}/stream/${encodeURIComponent(t.id)}?web=true`);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const d = await r.json();
        audio.src = d.url;
        await audio.play();
        setPlayIcon(false);
        startSmoothProgress();
        if (vizEnabled) startVisualizer();

        // Show quality info from response
        const ql = [d.quality, d.bitDepth ? `${d.bitDepth}bit` : '', d.sampleRate ? `${(d.sampleRate / 1000).toFixed(1)}kHz` : ''].filter(Boolean).join(' / ');
        document.getElementById('pQuality').textContent = ql;
      } catch (e) {
        toast(`Playback error: ${e.message}`, 'err');
        setPlayIcon(false);
        stopSmoothProgress();
        stopVisualizer();
      }
    }

    function togglePlay() {
      if (!audio.src) return;
      initAudioContext();
      if (audio.paused) {
        audio.play().then(() => {
          setPlayIcon(false);
          startSmoothProgress();
          if (vizEnabled) startVisualizer();
        }).catch(() => { });
      } else {
        audio.pause();
        setPlayIcon(false);
        stopSmoothProgress();
        stopVisualizer();
      }
    }

    function setPlayIcon(loading, spinner = false) {
      const icon = document.getElementById('pPlayIcon');
      if (loading && spinner) {
        icon.innerHTML = '<circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="2" fill="none" stroke-dasharray="25" stroke-dashoffset="25"><animate attributeName="stroke-dashoffset" values="25;0" dur="0.6s" repeatCount="indefinite"/></circle>';
      } else if (!audio.paused) {
        icon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
      } else {
        icon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
      }
      updateRowStates();
    }

    function updateRowStates() {
      document.querySelectorAll('.track-row').forEach(row => {
        const cur = nowPlaying && String(row.dataset.id) === String(nowPlaying.id);
        row.classList.toggle('is-playing', cur);
        const btn = row.querySelector('.play-btn-small');
        if (btn) btn.innerHTML = (cur && !audio.paused) ? pauseIcon(14) : playIcon(14);
      });
    }

    function audioListeners() {
      audio.addEventListener('play', () => {
        setPlayIcon(false);
        startSmoothProgress();
        if (vizEnabled) startVisualizer();
      });
      audio.addEventListener('pause', () => {
        setPlayIcon(false);
        stopSmoothProgress();
        stopVisualizer();
      });
      audio.addEventListener('ended', () => {
        endPlayer();
      });
    }

    function setVolume(v) { audio.volume = v; }

    async function dlCurrent() {
      if (!nowPlaying) return;
      if (!apiKey) { openKeyModal(true); return; }
      const btn = document.getElementById('pDlBtn');
      try {
        await downloadSingleTrack(nowPlaying, nowPlaying.title, btn);
      } catch (_) { }
    }

    // ── Audio Visualizer (Stereo L/R Sand Particle Wave Engine) ───────────────
    let vizEnabled = localStorage.getItem('nullbeat_visualizer') !== 'false';
    let audioCtx = null;
    let analyserL = null;
    let analyserR = null;
    let sourceNode = null;
    let splitterNode = null;
    let vizAnimFrame = null;
    let freqDataL = null;
    let freqDataR = null;

    function initAudioContext() {
      if (audioCtx) return;
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        audioCtx = new AudioContextClass();
        sourceNode = audioCtx.createMediaElementSource(audio);

        splitterNode = audioCtx.createChannelSplitter(2);
        analyserL = audioCtx.createAnalyser();
        analyserR = audioCtx.createAnalyser();
        analyserL.fftSize = 256;
        analyserR.fftSize = 256;
        analyserL.smoothingTimeConstant = 0.78;
        analyserR.smoothingTimeConstant = 0.78;

        sourceNode.connect(splitterNode);
        splitterNode.connect(analyserL, 0); // Output 0 = Left channel
        splitterNode.connect(analyserR, 1); // Output 1 = Right channel
        sourceNode.connect(audioCtx.destination);

        freqDataL = new Uint8Array(analyserL.frequencyBinCount);
        freqDataR = new Uint8Array(analyserR.frequencyBinCount);
      } catch (err) {
        console.warn('[Visualizer] Using high-fidelity stereo procedural wave engine:', err.message);
      }
    }

    function updateVizBtnUI() {
      const btn = document.getElementById('vizToggleBtn');
      const canvas = document.getElementById('playerVisualizer');
      if (btn) {
        btn.classList.toggle('is-off', !vizEnabled);
        btn.title = vizEnabled ? 'Visualizer: ON (Click to turn off)' : 'Visualizer: OFF (Click to turn on)';
      }
      if (canvas) {
        canvas.classList.toggle('hidden', !vizEnabled);
      }
    }

    function toggleVisualizer() {
      vizEnabled = !vizEnabled;
      localStorage.setItem('nullbeat_visualizer', vizEnabled ? 'true' : 'false');
      updateVizBtnUI();

      if (vizEnabled) {
        if (!audio.paused) startVisualizer();
      } else {
        stopVisualizer();
      }
    }

    function startVisualizer() {
      const canvas = document.getElementById('playerVisualizer');
      if (!canvas || !vizEnabled) return;
      canvas.classList.remove('hidden');

      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      if (vizAnimFrame) cancelAnimationFrame(vizAnimFrame);

      const ctx = canvas.getContext('2d');
      let wavePhase = 0;

      function draw() {
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        const displayW = Math.round(rect.width || window.innerWidth);
        const displayH = Math.round(rect.height || 48);

        if (canvas.width !== displayW * dpr || canvas.height !== displayH * dpr) {
          canvas.width = displayW * dpr;
          canvas.height = displayH * dpr;
        }

        ctx.save();
        ctx.scale(dpr, dpr);
        ctx.clearRect(0, 0, displayW, displayH);

        const isPlaying = !audio.paused && !audio.ended;
        wavePhase += isPlaying ? 0.06 : 0.015;

        // Collect Real Frequency Data for L & R
        let hasRealL = false;
        let hasRealR = false;
        if (analyserL && freqDataL && isPlaying) {
          try {
            analyserL.getByteFrequencyData(freqDataL);
            for (let i = 0; i < freqDataL.length; i++) {
              if (freqDataL[i] > 0) { hasRealL = true; break; }
            }
          } catch (_) { }
        }
        if (analyserR && freqDataR && isPlaying) {
          try {
            analyserR.getByteFrequencyData(freqDataR);
            for (let i = 0; i < freqDataR.length; i++) {
              if (freqDataR[i] > 0) { hasRealR = true; break; }
            }
          } catch (_) { }
        }

        const midX = displayW / 2;
        const baselineY = displayH - 2;

        // Subtle Channel Indicators at far edges
        ctx.save();
        ctx.font = '700 8px "Space Mono", monospace';
        ctx.fillStyle = 'rgba(255, 255, 255, 0.18)';
        ctx.fillText('L', 10, 12);
        ctx.fillText('R', displayW - 18, 12);
        ctx.restore();

        // Wave Layer Configurations (3 wave ribbons + sprayed sand particles)
        const layers = [
          { freqPow: 1.25, speedMult: 1.0, hScale: 0.88, count: 64, grainR: 1.2, alpha: 0.95 },
          { freqPow: 1.65, speedMult: -0.75, hScale: 0.68, count: 56, grainR: 1.0, alpha: 0.80 },
          { freqPow: 2.10, speedMult: 1.3, hScale: 0.48, count: 48, grainR: 0.85, alpha: 0.65 }
        ];

        // Draw Continuous Wave with Distinct L & R Halves (Joined Through Middle Gradient)
        const gradRadius = Math.max(16, displayW * 0.04);

        layers.forEach((layer, layerIdx) => {
          const numPoints = layer.count * 2;
          const step = displayW / numPoints;
          const points = [];

          // Helper to get Left half wave data at any x
          function getLeftSample(x) {
            const u = Math.min(1, Math.max(0, x / midX));
            let inten = 0;
            if (hasRealL && freqDataL) {
              const binNorm = Math.pow(u, layer.freqPow);
              const binIdx = Math.min(freqDataL.length - 1, Math.floor(binNorm * (freqDataL.length - 1)));
              inten = (freqDataL[binIdx] || 0) / 255;
            } else if (isPlaying) {
              const bass = Math.sin(wavePhase * 2.2 + u * 3.5) * 0.4 + 0.45;
              const mid = Math.cos(wavePhase * 3.5 - u * 7.0 + layerIdx) * 0.3 + 0.3;
              const flutter = Math.sin(u * 12 + wavePhase * 5) * 0.2;
              inten = Math.max(0.05, Math.min(1, (bass + mid + flutter) * 0.72));
            } else {
              inten = Math.sin(wavePhase + u * 4 + layerIdx) * 0.06 + 0.08;
            }
            const launchY = Math.pow(inten, 1.25) * (displayH - 6) * layer.hScale;
            const waveHarm = Math.sin((u * 6) + (wavePhase * layer.speedMult) + layerIdx) * (2.8 + inten * 4.2);
            return { inten, y: Math.max(3, baselineY - launchY + waveHarm) };
          }

          // Helper to get Right half wave data at any x (flipped individual RHS)
          function getRightSample(x) {
            // Flip the individual RHS horizontally (starts at center, runs to outer edge flipped)
            const u = Math.min(1, Math.max(0, (displayW - x) / (displayW - midX)));
            let inten = 0;
            if (hasRealR && freqDataR) {
              const binNorm = Math.pow(u, layer.freqPow);
              const binIdx = Math.min(freqDataR.length - 1, Math.floor(binNorm * (freqDataR.length - 1)));
              inten = (freqDataR[binIdx] || 0) / 255;
            } else if (isPlaying) {
              const bass = Math.sin(wavePhase * 2.2 + u * 3.5 + 1.8) * 0.4 + 0.45;
              const mid = Math.cos(wavePhase * 3.5 - u * 7.0 + layerIdx + 0.8) * 0.3 + 0.3;
              const flutter = Math.sin(u * 12 + wavePhase * 5 + 2.5) * 0.2;
              inten = Math.max(0.05, Math.min(1, (bass + mid + flutter) * 0.72));
            } else {
              inten = Math.sin(wavePhase + u * 4 + layerIdx + 1.5) * 0.06 + 0.08;
            }
            const launchY = Math.pow(inten, 1.25) * (displayH - 6) * layer.hScale;
            const waveHarm = Math.sin((u * 6) + (wavePhase * layer.speedMult) + layerIdx + 1.4) * (2.8 + inten * 4.2);
            return { inten, y: Math.max(3, baselineY - launchY + waveHarm) };
          }

          for (let i = 0; i <= numPoints; i++) {
            const x = i * step;

            let ptY = baselineY;
            let intensity = 0;

            if (x < midX - gradRadius) {
              // 100% Left Channel
              const sL = getLeftSample(x);
              ptY = sL.y;
              intensity = sL.inten;
            } else if (x > midX + gradRadius) {
              // 100% Right Channel
              const sR = getRightSample(x);
              ptY = sR.y;
              intensity = sR.inten;
            } else {
              // Middle Gradient Join: smooth Hermite crossfade
              const sL = getLeftSample(x);
              const sR = getRightSample(x);
              const t = (x - (midX - gradRadius)) / (gradRadius * 2);
              const smoothT = t * t * (3 - 2 * t);
              ptY = (sL.y * (1 - smoothT)) + (sR.y * smoothT);
              intensity = (sL.inten * (1 - smoothT)) + (sR.inten * smoothT);
            }

            // Smooth height boost to middle part of equaliser without altering wave calculation math
            const centerDist = Math.abs(x - midX) / midX;
            const midBoost = 1 + 0.22 * Math.cos(centerDist * (Math.PI / 2));
            const boostedY = Math.max(2, baselineY - (baselineY - ptY) * midBoost);

            points.push({ x, y: boostedY, intensity });
          }

          // Draw single continuous connecting wave filament through middle gradient
          ctx.save();
          const lineGrad = ctx.createLinearGradient(0, 0, displayW, 0);
          lineGrad.addColorStop(0, `rgba(229, 43, 32, ${0.12 * layer.alpha})`);
          lineGrad.addColorStop(0.5, `rgba(255, 60, 45, ${0.22 * layer.alpha})`);
          lineGrad.addColorStop(1, `rgba(229, 43, 32, ${0.12 * layer.alpha})`);

          ctx.beginPath();
          ctx.moveTo(points[0].x, points[0].y);
          for (let i = 1; i < points.length; i++) {
            const prev = points[i - 1];
            const cur = points[i];
            const mx = (prev.x + cur.x) / 2;
            const my = (prev.y + cur.y) / 2;
            ctx.quadraticCurveTo(prev.x, prev.y, mx, my);
          }
          ctx.strokeStyle = lineGrad;
          ctx.lineWidth = 0.85;
          ctx.stroke();
          ctx.restore();

          // Draw Sand Grains on the flowing continuous wave
          for (let i = 0; i < points.length; i++) {
            const pt = points[i];
            const inten = pt.intensity;

            ctx.save();
            if (inten > 0.65) {
              ctx.fillStyle = 'rgba(255, 235, 230, 0.95)';
              ctx.shadowColor = 'rgba(229, 43, 32, 0.9)';
              ctx.shadowBlur = 5;
            } else if (inten > 0.35) {
              ctx.fillStyle = `rgba(255, 55, 40, ${layer.alpha})`;
              ctx.shadowColor = 'rgba(229, 43, 32, 0.4)';
              ctx.shadowBlur = 2;
            } else {
              ctx.fillStyle = `rgba(200, 30, 20, ${layer.alpha * 0.65})`;
            }

            const r = layer.grainR * (0.8 + inten * 0.5);
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, r, 0, Math.PI * 2);
            ctx.fill();

            // High intensity: launch extra airborne sand grains spraying upward
            if (inten > 0.48 && i % 2 === 0) {
              const sprayDist = (inten - 0.45) * 22;
              const sprayY = Math.max(2, pt.y - sprayDist - (Math.sin(i * 13 + wavePhase * 8) * 3));
              const sprayX = pt.x + (Math.cos(i * 7 + wavePhase * 5) * 2.5);

              ctx.fillStyle = 'rgba(255, 200, 190, 0.85)';
              ctx.shadowColor = 'rgba(229, 43, 32, 0.8)';
              ctx.shadowBlur = 3;
              ctx.beginPath();
              ctx.arc(sprayX, sprayY, 0.8, 0, Math.PI * 2);
              ctx.fill();
            }

            ctx.restore();
          }
        });

        ctx.restore();

        if (isPlaying || (!audio.paused && vizEnabled)) {
          vizAnimFrame = requestAnimationFrame(draw);
        }
      }

      vizAnimFrame = requestAnimationFrame(draw);
    }

    function stopVisualizer() {
      if (vizAnimFrame) {
        cancelAnimationFrame(vizAnimFrame);
        vizAnimFrame = null;
      }
      const canvas = document.getElementById('playerVisualizer');
      if (canvas) {
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    // ── Helpers ────────────────────────────────────────────────────────────────
    function playIcon(s) { return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>`; }
    function pauseIcon(s) { return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>`; }
    function dlSvg(s) { return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`; }

    function esc(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function toast(msg, type = '') {
      const wrap = document.getElementById('toastWrap');
      const el = document.createElement('div');
      el.className = `toast${type ? ' ' + type : ''}`;
      el.textContent = msg;
      wrap.appendChild(el);
      setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.25s'; setTimeout(() => el.remove(), 260); }, 3200);
    }

    // ── Keyboard shortcuts ─────────────────────────────────────────────────────
    function isTypingContext() {
      const el = document.activeElement;
      if (!el) return false;
      const tag = el.tagName.toLowerCase();
      if (tag === 'textarea' || el.isContentEditable) return true;
      if (tag === 'input') {
        const type = (el.type || 'text').toLowerCase();
        const textTypes = ['text', 'search', 'password', 'email', 'url', 'number', 'tel'];
        if (textTypes.includes(type)) return true;
      }
      return false;
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.key === ' ') {
        const isModalOpen = document.getElementById('keyOverlay')?.classList.contains('open');
        if (!isTypingContext() && !isModalOpen) {
          e.preventDefault();
          togglePlay();
        }
      }
    });
  </script>
</body>
